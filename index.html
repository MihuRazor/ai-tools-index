<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI工具大全索引 — 全球主流AI一站式导航</title>
    <meta name="description" content="精选全球100+主流AI工具，涵盖对话、图像、视频、音频、代码、写作、设计、搜索、3D、生产力十大领域，一站式导航快速找到你需要的人工智能助手。">
    <meta name="keywords" content="AI工具,人工智能,ChatGPT,Claude,Midjourney,AI导航,AI工具箱,AI软件">
    <meta property="og:title" content="AI工具大全索引">
    <meta property="og:description" content="精选全球100+主流AI工具，一站式导航">
    <meta property="og:type" content="website">
    <meta name="robots" content="index, follow">
    <style>
        :root {
            --bg: #0f0f23; --card-bg: #1a1a2e; --card-hover: #252542;
            --text: #e0e0ff; --text-secondary: #8b8bb5;
            --accent: #6366f1; --accent-hover: #818cf8;
            --border: #2d2d55; --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --tag-bg: #2d2d55; --tag-text: #a5a5f3;
            --search-bg: #1a1a2e; --search-border: #2d2d55;
            --link: #818cf8; --link-hover: #a5b4fc;
            --badge-free: #10b981; --badge-paid: #f59e0b; --badge-freemium: #3b82f6;
            --star: #fbbf24; --diff-beginner: #10b981; --diff-intermediate: #3b82f6; --diff-advanced: #f59e0b;
            --pop-hot: #ef4444; --pop-trending: #f59e0b; --fav-active: #ec4899;
            --status-ok: #10b981; --status-broken: #ef4444; --status-redirect: #f59e0b; --status-unknown: #8b8bb5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .skip-link { position: absolute; top: -40px; left: 0; background: var(--accent); color: #fff; padding: 8px 16px; z-index: 100; transition: top 0.3s; border-radius: 0 0 8px 0; }
        .skip-link:focus { top: 0; }
        header { text-align: center; padding: 60px 20px 40px; position: relative; overflow: hidden; }
        header::before { content: ''; position: absolute; top: -50%; left: 50%; transform: translateX(-50%); width: 800px; height: 800px; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%); pointer-events: none; }
        h1 { font-size: 3rem; font-weight: 800; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 12px; letter-spacing: -1px; }
        .subtitle { color: var(--text-secondary); font-size: 1.1rem; max-width: 500px; margin: 0 auto 30px; }
        .stats { display: flex; justify-content: center; gap: 40px; flex-wrap: wrap; }
        .stat { text-align: center; }
        .stat-num { font-size: 1.8rem; font-weight: 700; color: var(--accent); }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); }
        .controls { max-width: 1200px; margin: 0 auto 20px; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
        .search-wrap { position: relative; flex: 1; min-width: 260px; max-width: 500px; }
        .search-box { width: 100%; padding: 14px 20px 14px 48px; border: 1px solid var(--search-border); border-radius: 14px; background: var(--search-bg); color: var(--text); font-size: 1rem; outline: none; transition: all 0.3s ease; }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        .search-box::placeholder { color: var(--text-secondary); }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 1.1rem; pointer-events: none; }
        .control-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .control-select { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.9rem; cursor: pointer; outline: none; }
        .control-select:focus { border-color: var(--accent); }
        .toggle-btn { padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; user-select: none; }
        .toggle-btn:hover { border-color: var(--accent); color: var(--text); }
        .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .filter-tags { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 20px; margin-bottom: 40px; }
        .filter-tag { padding: 8px 18px; border-radius: 20px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all 0.2s; user-select: none; }
        .filter-tag:hover { border-color: var(--accent); color: var(--text); }
        .filter-tag.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .featured-section { max-width: 1200px; margin: 0 auto 40px; padding: 0 20px; }
        .featured-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: var(--accent); }
        .featured-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        main { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .category { margin-bottom: 50px; }
        .category-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
        .tool-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; transition: all 0.3s ease; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .tool-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: var(--shadow); background: var(--card-hover); }
        .tool-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), #a855f7); opacity: 0; transition: opacity 0.3s ease; }
        .tool-card:hover::after { opacity: 1; }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
        .tool-name { font-size: 1.1rem; font-weight: 700; color: var(--text); }
        .fav-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-secondary); transition: color 0.2s; padding: 2px; line-height: 1; }
        .fav-btn:hover, .fav-btn.active { color: var(--fav-active); }
        .fav-btn:focus { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
        .tool-highlight { font-size: 0.85rem; color: var(--accent-hover); margin-bottom: 8px; font-weight: 500; min-height: 1.4em; }
        .tool-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 14px; line-height: 1.5; flex: 1; }
        .meta-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
        .stars { color: var(--star); font-size: 0.9rem; letter-spacing: 1px; }
        .stars .empty { color: var(--border); }
        .diff-badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
        .diff-beginner { background: rgba(16,185,129,0.15); color: var(--diff-beginner); }
        .diff-intermediate { background: rgba(59,130,246,0.15); color: var(--diff-intermediate); }
        .diff-advanced { background: rgba(245,158,11,0.15); color: var(--diff-advanced); }
        .pop-badge { font-size: 0.75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 3px; }
        .pop-hot { color: var(--pop-hot); }
        .pop-trending { color: var(--pop-trending); }
        .tool-badge { font-size: 0.65rem; padding: 3px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-free { background: rgba(16,185,129,0.15); color: var(--badge-free); }
        .badge-paid { background: rgba(245,158,11,0.15); color: var(--badge-paid); }
        .badge-freemium { background: rgba(59,130,246,0.15); color: var(--badge-freemium); }
        .url-status { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .url-ok { color: var(--status-ok); }
        .url-redirect { color: var(--status-redirect); }
        .url-broken { color: var(--status-broken); }
        .url-unknown { color: var(--status-unknown); }
        .tool-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
        .tool-tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tool-tag { font-size: 0.75rem; padding: 3px 10px; border-radius: 8px; background: var(--tag-bg); color: var(--tag-text); }
        .tool-link { display: inline-flex; align-items: center; gap: 4px; color: var(--link); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: color 0.2s ease; padding: 6px 12px; border-radius: 8px; background: rgba(99,102,241,0.1); white-space: nowrap; }
        .tool-link:hover { color: var(--link-hover); background: rgba(99,102,241,0.2); }
        .tool-link:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
        .updated-at { font-size: 0.75rem; color: var(--text-secondary); opacity: 0.7; margin-top: 8px; }
        .github-stars { font-size: 0.75rem; color: var(--star); display: flex; align-items: center; gap: 3px; }
        .no-results { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 1.1rem; display: none; }
        .no-results.show { display: block; }
        .loading { text-align: center; padding: 80px 20px; color: var(--text-secondary); font-size: 1.1rem; }
        .loading-error { text-align: center; padding: 80px 20px; color: var(--status-broken); font-size: 1.1rem; }
        footer { text-align: center; padding: 40px 20px; border-top: 1px solid var(--border); color: var(--text-secondary); font-size: 0.85rem; }
        footer a { color: var(--accent); text-decoration: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .tool-card { animation: fadeInUp 0.5s ease forwards; }
        @media (max-width: 640px) { h1 { font-size: 2rem; } .tools-grid, .featured-grid { grid-template-columns: 1fr; } .stats { gap: 24px; } .controls { flex-direction: column; align-items: stretch; } .search-wrap { max-width: 100%; } .control-group { justify-content: flex-start; } }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">跳转到主内容</a>
    <header role="banner">
        <h1>AI 工具大全</h1>
        <p class="subtitle">精选全球主流 AI 工具，一站式导航，每周自动更新数据</p>
        <div class="stats" aria-label="站点统计">
            <div class="stat"><div class="stat-num" id="total-tools">0</div><div class="stat-label">收录工具</div></div>
            <div class="stat"><div class="stat-num" id="total-categories">0</div><div class="stat-label">分类类别</div></div>
            <div class="stat"><div class="stat-num" id="last-updated">--</div><div class="stat-label">最后更新</div></div>
        </div>
    </header>
    <div class="controls">
        <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">🔍</span>
            <input type="text" class="search-box" id="searchInput" placeholder="搜索工具名称、功能、卖点..." aria-label="搜索工具">
        </div>
        <div class="control-group">
            <select class="control-select" id="sortSelect" aria-label="排序方式"><option value="default">默认排序</option><option value="rating">评分从高到低</option><option value="popularity">按热度</option><option value="name">按名称</option></select>
            <select class="control-select" id="diffSelect" aria-label="难度筛选"><option value="all">全部难度</option><option value="beginner">初级</option><option value="intermediate">中级</option><option value="advanced">高级</option></select>
            <button class="toggle-btn" id="featuredToggle" aria-pressed="false">仅看精选</button>
        </div>
    </div>
    <div class="filter-tags" id="categoryFilters" role="tablist" aria-label="分类筛选"><div class="filter-tag active" data-category="all" role="tab" aria-selected="true">全部</div></div>
    <section class="featured-section" id="featuredSection" aria-label="精选推荐" style="display:none"><h2 class="featured-title">⭐ 精选推荐</h2><div class="featured-grid" id="featuredGrid"></div></section>
    <main id="main-content" aria-label="工具列表">
        <div class="loading" id="loading">📡 正在从数据库加载数据...</div>
        <div class="loading-error" id="loadError" style="display:none"></div>
        <div id="toolsContainer"></div>
        <div class="no-results" id="noResults" role="status">😕 没有找到匹配的工具，换个关键词试试？</div>
    </main>
    <footer><p>AI 工具大全索引 | 数据每周自动更新，仅供参考</p><p style="margin-top:8px">数据验证由自动化爬虫维护，请以各官网信息为准</p></footer>

    <!-- Supabase JS 客户端 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <script>
    (function() {
        'use strict';

        // ===== 配置：请替换为你的 Supabase 项目信息 =====
        const SUPABASE_URL = 'https://ikxwcnvsznrwmpmhfvwh.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlreHdjbnZzem5yd21wbWhmdndoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMzMjEyMTMsImV4cCI6MjA5ODg5NzIxM30.7ko14iPg3Gg-Zk_yv1bgP08nd72vjPYW6zw4xRzdTEs';
        // ================================================

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const badgeLabels = { free: '免费', paid: '付费', freemium: '免费+付费' };
        const diffLabels = { beginner: '初级', intermediate: '中级', advanced: '高级' };
        const popLabels = { hot: '🔥 热门', trending: '📈 上升', normal: '' };
        const diffClasses = { beginner: 'diff-beginner', intermediate: 'diff-intermediate', advanced: 'diff-advanced' };
        const urlStatusLabels = { ok: '✓ 正常', redirect: '↪ 已重定向', broken: '✗ 失效', unknown: '? 未知' };
        const urlStatusClasses = { ok: 'url-ok', redirect: 'url-redirect', broken: 'url-broken', unknown: 'url-unknown' };

        let state = { category: 'all', query: '', sort: 'default', difficulty: 'all', featuredOnly: false, favorites: new Set() };
        let categories = [], tools = [], lastUpdate = null;

        try { const saved = localStorage.getItem('ai_tool_favorites'); if (saved) state.favorites = new Set(JSON.parse(saved)); } catch(e) {}
        function saveFavorites() { try { localStorage.setItem('ai_tool_favorites', JSON.stringify([...state.favorites])); } catch(e) {} }

        function toggleFav(id, btn) {
            if (state.favorites.has(id)) { state.favorites.delete(id); btn.classList.remove('active'); btn.setAttribute('aria-label', '收藏此工具'); btn.textContent = '♡'; }
            else { state.favorites.add(id); btn.classList.add('active'); btn.setAttribute('aria-label', '取消收藏'); btn.textContent = '❤'; }
            saveFavorites();
        }
        function renderStars(r) { const f='★', e='☆'; return f.repeat(r)+e.repeat(5-r); }

        async function loadData() {
            document.getElementById('loading').style.display = '';
            document.getElementById('loadError').style.display = 'none';
            try {
                const [catResp, toolsResp, logResp] = await Promise.all([
                    supabase.from('categories').select('*').order('sort_order', { ascending: true }),
                    supabase.from('tools').select('*').eq('is_active', true),
                    supabase.from('update_logs').select('run_at').order('run_at', { ascending: false }).limit(1)
                ]);
                if (catResp.error) throw catResp.error;
                if (toolsResp.error) throw toolsResp.error;
                categories = catResp.data || [];
                tools = toolsResp.data || [];
                if (logResp.data && logResp.data.length > 0) {
                    lastUpdate = new Date(logResp.data[0].run_at);
                    document.getElementById('last-updated').textContent = lastUpdate.toLocaleDateString('zh-CN');
                }
                document.getElementById('loading').style.display = 'none';
                buildCategoryTabs();
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('loading').style.display = 'none';
                const errDiv = document.getElementById('loadError');
                errDiv.style.display = '';
                errDiv.innerHTML = '<p>❌ 数据加载失败</p><p style="font-size:0.9rem;margin-top:8px">' + (err.message || '请检查 Supabase 配置和网络连接') + '</p>';
            }
        }

        function buildCategoryTabs() {
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '<div class="filter-tag active" data-category="all" role="tab" aria-selected="true">全部</div>';
            categories.forEach(cat => {
                const tab = document.createElement('div');
                tab.className = 'filter-tag';
                tab.dataset.category = cat.id;
                tab.setAttribute('role', 'tab');
                tab.setAttribute('aria-selected', 'false');
                tab.textContent = cat.icon + ' ' + cat.title;
                container.appendChild(tab);
            });
            container.addEventListener('click', (e) => {
                if (!e.target.classList.contains('filter-tag')) return;
                container.querySelectorAll('.filter-tag').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
                e.target.classList.add('active');
                e.target.setAttribute('aria-selected', 'true');
                state.category = e.target.dataset.category;
                render();
            });
        }

        function createCard(item, isFeatured) {
            const card = document.createElement('article');
            card.className = 'tool-card';
            card.setAttribute('role', 'article');
            card.setAttribute('aria-label', item.name);
            if (!isFeatured) card.style.animationDelay = Math.random() * 0.3 + 's';
            const isFav = state.favorites.has(item.id);
            const popHtml = popLabels[item.popularity] ? `<span class="pop-badge pop-${item.popularity}">${popLabels[item.popularity]}</span>` : '';
            const urlStatusHtml = item.url_status && item.url_status !== 'ok' ? `<span class="url-status ${urlStatusClasses[item.url_status] || 'url-unknown'}">${urlStatusLabels[item.url_status] || item.url_status}</span>` : '';
            const starsHtml = item.github_stars ? `<span class="github-stars" title="GitHub Stars">⭐ ${item.github_stars.toLocaleString()}</span>` : '';

            card.innerHTML = `
                <div class="card-top"><span class="tool-name">${item.name}</span><button class="fav-btn ${isFav ? 'active' : ''}" aria-label="${isFav ? '取消收藏' : '收藏此工具'}" title="${isFav ? '取消收藏' : '收藏此工具'}">${isFav ? '❤' : '♡'}</button></div>
                <div class="tool-highlight">${item.highlight || ''}</div>
                <div class="tool-desc">${item.desc || ''}</div>
                <div class="meta-row">
                    <span class="stars" aria-label="评分 ${item.rating} 星" title="评分 ${item.rating}/5">${renderStars(item.rating)}</span>
                    <span class="diff-badge ${diffClasses[item.difficulty] || ''}" title="使用难度">${diffLabels[item.difficulty] || item.difficulty}</span>
                    ${popHtml}<span class="tool-badge badge-${item.badge}">${badgeLabels[item.badge] || item.badge}</span>
                    ${urlStatusHtml}${starsHtml}
                </div>
                <div class="tool-footer"><div class="tool-tags">${(item.tags || []).map(t => `<span class="tool-tag">${t}</span>`).join('')}</div><a class="tool-link" href="${item.url}" target="_blank" rel="noopener noreferrer" aria-label="访问 ${item.name} 官网" onclick="event.stopPropagation()">访问 ↗</a></div>
                <div class="updated-at">验证日期：${item.updated_at || '—'}</div>`;
            const favBtn = card.querySelector('.fav-btn');
            favBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFav(item.id, favBtn); });
            card.addEventListener('click', () => window.open(item.url, '_blank'));
            return card;
        }

        function getFiltered() {
            const q = state.query.toLowerCase().trim();
            let list = tools.filter(t => {
                const catMatch = state.category === 'all' || (t.category_ids && t.category_ids.includes(state.category));
                const searchMatch = !q || (t.name && t.name.toLowerCase().includes(q)) || (t.desc && t.desc.toLowerCase().includes(q)) || (t.highlight && t.highlight.toLowerCase().includes(q)) || (t.tags && t.tags.some(tag => tag.toLowerCase().includes(q)));
                const diffMatch = state.difficulty === 'all' || t.difficulty === state.difficulty;
                const featMatch = !state.featuredOnly || t.featured;
                return catMatch && searchMatch && diffMatch && featMatch;
            });
            if (state.sort === 'rating') { list.sort((a, b) => (b.rating || 0) - (a.rating || 0) || (a.name || '').localeCompare(b.name || '', 'zh')); }
            else if (state.sort === 'name') { list.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh')); }
            else if (state.sort === 'popularity') { const order = { hot: 3, trending: 2, normal: 1 }; list.sort((a, b) => (order[b.popularity] || 0) - (order[a.popularity] || 0) || (b.rating || 0) - (a.rating || 0)); }
            return list;
        }

        function render() {
            const container = document.getElementById('toolsContainer');
            const noResults = document.getElementById('noResults');
            const featuredSection = document.getElementById('featuredSection');
            const featuredGrid = document.getElementById('featuredGrid');
            container.innerHTML = ''; featuredGrid.innerHTML = '';
            const filtered = getFiltered();
            const featured = filtered.filter(t => t.featured);
            document.getElementById('total-tools').textContent = filtered.length;
            document.getElementById('total-categories').textContent = categories.length;
            if (state.category === 'all' && !state.query && state.difficulty === 'all' && !state.featuredOnly && featured.length > 0) {
                featuredSection.style.display = '';
                const frag = document.createDocumentFragment();
                featured.slice(0, 6).forEach(item => frag.appendChild(createCard(item, true)));
                featuredGrid.appendChild(frag);
            } else { featuredSection.style.display = 'none'; }
            if (filtered.length === 0) { noResults.classList.add('show'); return; }
            noResults.classList.remove('show');
            const frag = document.createDocumentFragment();
            if (state.category === 'all' && state.sort === 'default') {
                categories.forEach(cat => {
                    const catItems = filtered.filter(t => t.category_ids && t.category_ids.includes(cat.id));
                    if (catItems.length === 0) return;
                    const section = document.createElement('section');
                    section.className = 'category'; section.setAttribute('aria-label', cat.title);
                    section.innerHTML = `<h2 class="category-title"><span aria-hidden="true">${cat.icon}</span> ${cat.title}</h2>`;
                    const grid = document.createElement('div'); grid.className = 'tools-grid';
                    catItems.forEach(item => grid.appendChild(createCard(item)));
                    section.appendChild(grid); frag.appendChild(section);
                });
            } else { const grid = document.createElement('div'); grid.className = 'tools-grid'; filtered.forEach(item => grid.appendChild(createCard(item))); frag.appendChild(grid); }
            container.appendChild(frag);
        }

        let searchTimer;
        document.getElementById('searchInput').addEventListener('input', (e) => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { state.query = e.target.value; render(); }, 300); });
        document.getElementById('sortSelect').addEventListener('change', (e) => { state.sort = e.target.value; render(); });
        document.getElementById('diffSelect').addEventListener('change', (e) => { state.difficulty = e.target.value; render(); });
        const featuredToggle = document.getElementById('featuredToggle');
        featuredToggle.addEventListener('click', () => { state.featuredOnly = !state.featuredOnly; featuredToggle.classList.toggle('active', state.featuredOnly); featuredToggle.setAttribute('aria-pressed', state.featuredOnly); render(); });

        loadData();
    })();
    </script>
</body>
</html>
